                            const offset = (j * 2 - 3) * 6;
                            px += offset;
                            py += offset;
                        }
                    }
                    // 绘制飞机
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    ctx.beginPath();
                    ctx.arc(px, py, planeRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = colorMap[col] || '#888';
                    ctx.fill();
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    // 编号
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(j + 1, px, py + 1);
                    // 如果当前玩家选中该飞机
                    if (flyState.phase === 'select' && pi === flyState.currentPlayer && flyState.moveablePlanes.includes(j)) {
                        ctx.strokeStyle = '#ff0';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(px, py, planeRadius + 4, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
            }

            // 显示玩家信息
            ctx.fillStyle = '#3d2817';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            let info = '';
            for (let i = 0; i < flyState.players.length; i++) {
                const p = flyState.players[i];
                info += `${p.name}${p.finished}/4 `;
            }
            ctx.fillText(info, 10, 10);
        }

        // ---- 事件处理 ----
        function getBoardPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            if (gameType === 'chess') {
                const cell = CELL_SIZE,
                    margin = MARGIN;
                let minDist = cell * 0.45,
                    best = null;
                for (let r = 0; r < CHESS_ROWS; r++) {
                    for (let c = 0; c < CHESS_COLS; c++) {
                        const px = margin + c * cell,
                            py = margin + r * cell;
                        const dist = Math.hypot(x - px, y - py);
                        if (dist < minDist) { minDist = dist;
                            best = { row: r, col: c }; }
                    }
                }
                return best;
            } else if (gameType === 'fly') {
                // 检测点击飞机
                if (!flyState || flyState.phase !== 'select') return null;
                const playerIdx = flyState.currentPlayer;
                const player = flyState.players[playerIdx];
                const moveable = flyState.moveablePlanes;
                // 遍历可移动飞机
                for (const idx of moveable) {
                    const pos = player.planes[idx];
                    let px, py;
                    if (pos === -1) {
                        // 起点区域
                        const angle = (playerIdx / flyState.players.length) * 2 * Math.PI - Math.PI / 2;
                        const rOffset = 100;
                        const cx = W / 2 + rOffset * Math.cos(angle);
                        const cy = H / 2 + rOffset * Math.sin(angle);
                        const offX = (idx - 1.5) * 18;
                        const offY = (idx % 2) * 18;
                        px = cx + offX;
                        py = cy + offY;
                    } else {
                        const pt = flyState.pathPoints[pos % flyState.pathPoints.length];
                        px = pt.x;
                        py = pt.y;
                    }
                    const dist = Math.hypot(x - px, y - py);
                    if (dist < flyState.planeRadius + 8) {
                        return { row: idx, col: -1 }; // 用row存储飞机索引
                    }
                }
                return null;
            } else {
                let minDist = CELL_SIZE * 0.55,
                    best = null;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const px = MARGIN + c * CELL_SIZE,
                            py = MARGIN + r * CELL_SIZE;
                        const dist = Math.hypot(x - px, y - py);
                        if (dist < minDist) { minDist = dist;
                            best = { row: r, col: c }; }
                    }
                }
                return best;
            }
        }

        function onCanvasClick(e) {
            if (gameOver) {
                setStatus('⛔ 游戏已结束，请点击"新局"重新开始');
                return;
            }
            if (gameType === 'fly') {
                if (flyState.phase !== 'select') return;
                const pos = getBoardPos(e);
                if (!pos) return;
                if (pos.col === -1) {
                    // 选择飞机
                    const planeIdx = pos.row;
                    selectFlyPlane(planeIdx);
                }
                return;
            }
            const pos = getBoardPos(e);
            if (!pos) return;
            if (gameType === 'go' || gameType === 'gomoku') {
                placeStone(pos.row, pos.col);
                if (!gameOver && gameType === 'go') {
                    if (!hasLegalMove(currentPlayer)) {
                        const next = currentPlayer === 1 ? 2 : 1;
                        if (!hasLegalMove(next)) {
                            gameOver = true;
                            setStatus('🏁 游戏结束 · 双方无子可下');
                            updateUI();
                            render();
                            calculateScoreGo();
                        } else {
                            setStatus(`⏭️ ${currentPlayer === 1 ? '黑' : '白'}棋无子可下，自动虚手`);
                            currentPlayer = next;
                            updateUI();
                            render();
                            placeStonePass();
                        }
                    }
                }
            } else if (gameType === 'chess') {
                placeStone(pos.row, pos.col);
            }
        }

        function onCanvasMove(e) {
            if (gameType === 'chess' || gameType === 'fly') return;
            const pos = getBoardPos(e);
            if (pos) {
                if (!hoverPos || hoverPos.row !== pos.row || hoverPos.col !== pos.col) {
                    hoverPos = pos;
                    render();
                }
            } else {
                if (hoverPos) { hoverPos = null;
                    render(); }
            }
        }

        function onCanvasLeave() {
            if (hoverPos) { hoverPos = null;
                render(); }
        }

        // ---- 按钮事件 ----
        btnReset.addEventListener('click', () => {
            resetGame();
            setStatus('🔄 新局开始');
        });
        btnUndo.addEventListener('click', undoMove);

        // 掷骰按钮
        btnRoll.addEventListener('click', rollDice);

        // ---- 注册事件 ----
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('mousemove', onCanvasMove);
        canvas.addEventListener('mouseleave', onCanvasLeave);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onCanvasClick(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            onCanvasMove(e);
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
        });

        // ---- 键盘 ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') btnReset.click();
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                btnUndo.click();
            }
            if (e.key === ' ' && gameType === 'fly') {
                e.preventDefault();
                if (!btnRoll.disabled) btnRoll.click();
            }
        });

        // ---- 启动 ----
        resetGame();
        updateUIMode();
        window.addEventListener('resize', render);
        console.log('🎮 棋类游戏已启动！支持围棋、五子棋、中国象棋、飞行棋。');
        console.log('快捷键: R=新局, Ctrl+Z=悔棋, 空格=掷骰(飞行棋)');
    </script>
</body>
</html>
